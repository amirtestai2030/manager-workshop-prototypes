<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>לימוד תא השטח</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700&display=swap">
<style>
/* פריסה: מסגרת טלפון ממורכזת (עד 430px); שני מסכים (בית / שיעור) מוחלפים ב-hidden; חונך כפאנל מתקפל בבית */
:root {
  --bg: #F3F4F1; --surface: #FFFFFF; --sunk: #EEF0EC; --ink: #17212B; --muted: #55606B;
  --line: #DCE0DA; --line2: #9AA3AC; --accent: #1E4FA8; --on-accent: #FFFFFF;
  --warm: #A9480C; --warm-soft: #FBEBDD; --on-warm: #FFFFFF; --ok: #2F6B3F; --danger: #B42318;
  --ok-soft: #E4F0E6; --danger-soft: #FBE5E2;
  --font: Assistant, "Segoe UI", Arial, sans-serif;
  --display: Rubik, Assistant, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171D; --surface: #1B222A; --sunk: #151B21; --ink: #EEF1F4; --muted: #A7B0BA;
    --line: #2C3640; --line2: #56636F; --accent: #8EB0F2; --on-accent: #0E1620;
    --warm: #F0A464; --warm-soft: #3A2A1C; --on-warm: #1A1007; --ok: #86C79A; --danger: #FF9B8F;
    --ok-soft: #1E2F23; --danger-soft: #3A1F1C;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171D; --surface: #1B222A; --sunk: #151B21; --ink: #EEF1F4; --muted: #A7B0BA;
  --line: #2C3640; --line2: #56636F; --accent: #8EB0F2; --on-accent: #0E1620;
  --warm: #F0A464; --warm-soft: #3A2A1C; --on-warm: #1A1007; --ok: #86C79A; --danger: #FF9B8F;
  --ok-soft: #1E2F23; --danger-soft: #3A1F1C;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.55;
  direction: rtl;
}
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.stage {
  min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;
  padding-block: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage-note { text-align: center; color: var(--muted); font-size: 14px; line-height: 1.4; }
.stage-note strong { display: block; font-family: var(--display); font-weight: 500; color: var(--ink); font-size: 15px; }
.phone {
  width: 100%; max-width: 430px; min-height: 780px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px;
  overflow: hidden; display: flex; flex-direction: column;
}
.screen {
  flex: 1; display: flex; flex-direction: column; gap: 16px;
  padding-block: 20px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.footer {
  border-top: 1px solid var(--line); background: var(--sunk); color: var(--muted);
  font-size: 13px; line-height: 1.4; text-align: center;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (max-width: 480px) {
  .stage { padding: 0; gap: 0; }
  .stage-note { display: none; }
  .phone { max-width: none; min-height: 100%; border: 0; border-radius: 0; }
}

/* כותרת מסך */
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
h1, h2 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: 26px; }
h2 { font-size: 19px; }
.sub { color: var(--muted); margin: 0; }

/* מתג חונך */
.switch {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px;
  background: var(--sunk); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 6px 4px 12px; font-size: 14px; font-weight: 600; color: var(--muted);
  white-space: nowrap; flex-shrink: 0;
}
.switch .knob {
  width: 36px; height: 22px; border-radius: 999px; background: var(--line2); position: relative;
  transition: background .15s;
}
.switch .knob::after {
  content: ""; position: absolute; top: 3px; right: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: var(--surface); transition: transform .15s;
}
.switch[aria-pressed="true"] { color: var(--ink); border-color: var(--accent); }
.switch[aria-pressed="true"] .knob { background: var(--accent); }
.switch[aria-pressed="true"] .knob::after { transform: translateX(-14px); }

/* התקדמות */
.progress { background: var(--sunk); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.progress-row .big { font-family: var(--display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; transition: width .25s; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1px solid transparent;
  font-weight: 700; font-size: 16px; width: 100%;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:disabled { opacity: .45; cursor: default; }
.btn-ghost { background: transparent; border-color: var(--line2); color: var(--ink); }
.btn-warm { background: var(--warm-soft); color: var(--ink); border-color: transparent; }

/* רשימת נושאים */
.topics { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.topic {
  width: 100%; display: flex; align-items: center; gap: 12px; text-align: right;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 12px 14px; min-height: 64px;
}
.topic .num {
  font-family: var(--display); font-weight: 500; color: var(--muted); font-size: 14px; width: 18px;
  font-variant-numeric: tabular-nums; flex-shrink: 0;
}
.topic .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.topic .name { font-weight: 700; font-size: 17px; }
.topic .meta { font-size: 13px; color: var(--muted); }
.dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 2px solid var(--line2); background: transparent; }
.dot.done { background: var(--ok); border-color: var(--ok); }
.dot.progress { background: var(--warm); border-color: var(--warm); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dot { width: 10px; height: 10px; }

/* פאנל חונך */
.mentor { background: var(--warm-soft); border-radius: 18px; padding: 14px 16px; display: grid; gap: 12px; }
.mentor h2 { font-size: 17px; }
.mentor-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.mentor-list li { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
.mentor-list .state { color: var(--muted); font-variant-numeric: tabular-nums; }
.mentor-list .state.done { color: var(--ok); font-weight: 700; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14px; }
.field textarea {
  width: 100%; min-height: 88px; resize: vertical; border: 1px solid var(--line2); border-radius: 12px;
  background: var(--surface); padding: 10px 12px; line-height: 1.5;
}
.saved { font-size: 13px; color: var(--muted); min-height: 1.3em; }

/* מסך שיעור */
.back { background: none; border: 0; padding: 0; min-height: 44px; color: var(--accent); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
.lesson-body p { margin: 0 0 12px; max-width: 60ch; }
.lesson-body p:last-child { margin-bottom: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.quiz { display: grid; gap: 16px; }
.q { display: grid; gap: 8px; }
.q .qt { font-weight: 700; }
.opt {
  width: 100%; text-align: right; min-height: 44px; padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  display: flex; align-items: center; gap: 10px;
}
.opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line2); flex-shrink: 0; }
.opt[aria-checked="true"] { border-color: var(--accent); background: var(--sunk); }
.opt[aria-checked="true"] .radio { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--surface); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
.opt:disabled { cursor: default; }
.why { font-size: 14px; padding: 8px 12px; border-radius: 10px; background: var(--sunk); }
.why.ok { color: var(--ok); font-weight: 600; }
.why.bad { color: var(--danger); font-weight: 600; }
.result { border-radius: 16px; padding: 14px 16px; display: grid; gap: 8px; }
.result.pass { background: var(--ok-soft); }
.result.fail { background: var(--warm-soft); }
.result .score { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; }

.reset { margin-top: auto; align-self: center; background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; min-height: 44px; padding: 0 8px; }
.toast { font-size: 13px; color: var(--ok); text-align: center; min-height: 1.3em; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="stage">
  <div class="stage-note"><strong>אב טיפוס להדגמה</strong>נתוני דוגמה בלבד. שום דבר לא נשלח לשרת.</div>

  <div class="phone">
    <!-- מסך בית -->
    <main class="screen" id="home">
      <div class="top">
        <div>
          <div class="eyebrow">רובע הגפן</div>
          <h1>להכיר את השטח שלי</h1>
        </div>
        <button type="button" class="switch" id="mentorToggle" aria-pressed="false">
          <span>מצב חונך</span><span class="knob" aria-hidden="true"></span>
        </button>
      </div>

      <section class="mentor" id="mentorPanel" hidden>
        <h2>מה החניך סיים</h2>
        <ul class="mentor-list" id="mentorList"></ul>
        <div class="field">
          <label for="mentorNote">הערת חונך</label>
          <textarea id="mentorNote" placeholder="מה לחזק בפגישה הבאה"></textarea>
          <div class="saved" id="noteSaved"></div>
        </div>
      </section>

      <section class="progress" aria-live="polite">
        <div class="progress-row">
          <span class="big" id="progressText">0 מתוך 5 נושאים</span>
          <span class="eyebrow" id="progressHint"></span>
        </div>
        <div class="bar"><span id="progressBar" style="width:0%"></span></div>
        <button type="button" class="btn btn-primary" id="nextBtn">נושא הבא</button>
      </section>

      <ul class="topics" id="topicList"></ul>
      <div class="legend">
        <span><i class="dot done"></i>הושלם</span>
        <span><i class="dot progress"></i>בתהליך</span>
        <span><i class="dot"></i>עוד לא התחיל</span>
      </div>

      <div class="toast" id="toast"></div>
      <button type="button" class="reset" id="resetBtn">איפוס לדוגמה</button>
    </main>

    <!-- מסך שיעור -->
    <main class="screen" id="lesson" hidden>
      <button type="button" class="back" id="backBtn">&rsaquo; חזרה לרשימה</button>
      <div>
        <div class="eyebrow" id="lessonEyebrow"></div>
        <h1 id="lessonTitle"></h1>
      </div>
      <div class="lesson-body card" id="lessonBody"></div>
      <h2>בדיקה קצרה</h2>
      <div class="quiz" id="quiz"></div>
      <div id="resultBox"></div>
      <button type="button" class="btn btn-primary" id="checkBtn" disabled>בדיקת תשובות</button>
      <button type="button" class="btn btn-ghost" id="retryBtn" hidden>ניסיון נוסף</button>
      <button type="button" class="btn btn-warm" id="doneBtn" hidden>חזרה לרשימה</button>
    </main>

    <div class="footer">אב טיפוס להדגמה בסדנא. נתוני דוגמה בלבד. נבנה עם Claude, בלי לכתוב קוד.</div>
  </div>
</div>

<script>
(function () {
  var KEY = 'field-cell-proto-v1';
  var PASS = 2;

  var TOPICS = [
    {
      id: 'intro', title: 'מבוא', sub: 'גבולות הרובע ושלושת המוסדות',
      paras: [
        'רובע הגפן הוא אזור האחריות שלך. הוא משתרע בין שדרות הזית בצפון לרחוב התאנה בדרום, וחוצה אותו לאורכו רחוב הגפן, שעל שמו נקרא הרובע. ברובע כארבעים בניינים, גינה ציבורית אחת ושלושה מוסדות ציבור.',
        'שלושת המוסדות שתכיר מהר: המרכז הקהילתי "בית הגפן" בפינת רחוב הגפן ושדרות הזית, מרפאת הרובע ברחוב התאנה 12, ובית הספר "ניצנים" בסמטת הרימון.',
        'הדרך הכי טובה להכיר את הרובע היא סבב רגלי אחד עם החונך שלך. מתחילים במרכז הקהילתי, הולכים דרומה לאורך רחוב הגפן ומסיימים בבית הספר. הסבב לוקח כארבעים דקות.'
      ],
      quiz: [
        { q: 'איזה רחוב חוצה את הרובע לאורכו?', opts: ['רחוב הגפן', 'רחוב התאנה', 'שדרות הזית'], a: 0, why: 'רחוב הגפן חוצה את הרובע לאורכו, ועל שמו הרובע נקרא.' },

        { q: 'כמה זמן לוקח סבב רגלי מלא עם החונך?', opts: ['כעשר דקות', 'כארבעים דקות', 'כשעתיים'], a: 1, why: 'סבב מלא מהמרכז הקהילתי עד בית הספר לוקח כארבעים דקות.' }
      ]
    },
    {
      id: 'basics', title: 'מושגי יסוד', sub: 'ארבעה מושגים שחוזרים כל יום',

    {

      paras: [
        'דיווח על תקלה בשלושה צעדים: מצלמים את התקלה, פותחים קריאה ביומן הרובע עם מיקום ואזור משנה, ומעדכנים את איש הקשר של המוסד הקרוב. תקלה דחופה (נזילה, חוט חשמל חשוף) מדווחים גם בטלפון לאמיר.',
        'הפגישה השבועית מתקיימת בכל יום שלישי בשעה 09:00 במרכז הקהילתי. מגיעים אליה עם רשימת התקלות הפתוחות באזור המשנה שלך. אם אי אפשר להגיע, מודיעים לנועה יום קודם.',
        'למי מתקשרים: שאלה על הרובע, לסאמר החונך. בעיה בלוח הזמנים או חופשה, לנועה. תקלה פיזית דחופה, לאמיר. כל מספרי הטלפון נמצאים בלוח המודעות במרכז הקהילתי ובדף אנשי הקשר ביומן הרובע.'
      ],
      quiz: [
        { q: 'מה הצעד הראשון בדיווח על תקלה?', opts: ['מתקשרים לנועה', 'מצלמים את התקלה', 'מחכים לפגישה השבועית'], a: 1, why: 'קודם מצלמים, אחר כך פותחים קריאה ביומן ומעדכנים את איש הקשר.' },
        { q: 'מתי מתקיימת הפגישה השבועית?', opts: ['יום ראשון, 08:00', 'יום שלישי, 09:00', 'יום חמישי, 12:00'], a: 1, why: 'הפגישה השבועית היא בכל יום שלישי בשעה 09:00 במרכז הקהילתי.' },
        { q: 'גילית נזילה בגינה הציבורית. למי מתקשרים?', opts: ['לדנה', 'לרנא', 'לאמיר'], a: 2, why: 'נזילה היא תקלה פיזית דחופה, ואת אלה מדווחים בטלפון לאמיר.' }
      ]
    },
    {
      id: 'summary', title: 'סיכום', sub: 'חזרה על הכול לפני שסאמר מאשר',
      paras: [
        'בחמישה נושאים עברת על רובע הגפן: הגבולות והמוסדות, המושגים שמשתמשים בהם ביום-יום, האנשים שתעבוד איתם והנהלים הבסיסיים.',
        'מה שחשוב לזכור: סבב בוקר כל יום, כל תקלה מקבלת מספר קריאה ואזור משנה, פגישה שבועית ביום שלישי, ובכל ספק פונים לחונך.',
        'החידון הזה חוזר על כל הנושאים. אחרי שתעבור אותו, בקש מסאמר לפתוח את מצב חונך ולאשר שסיימת את החפיפה.'
      ],
      quiz: [
        { q: 'באיזה מוסד מתקיימת הפגישה השבועית?', opts: ['במרפאה', 'במרכז הקהילתי', 'בבית הספר'], a: 1, why: 'הפגישה השבועית מתקיימת במרכז הקהילתי "בית הגפן".' },
        { q: 'מה חייבים לציין בכל דיווח על תקלה?', opts: ['מיקום ואזור משנה', 'רק את שם המדווח', 'את שעת הפגישה השבועית'], a: 0, why: 'כל קריאה ביומן נפתחת עם מיקום ואזור משנה.' },
        { q: 'מי רכזת הרובע?', opts: ['רנא', 'דנה', 'נועה'], a: 2, why: 'נועה היא רכזת הרובע ומנהלת את הפגישה השבועית.' }
      ]
    }
  ];

  function sample() {
    return {
      topics: {
        intro: { status: 'done', score: 3 },
        basics: { status: 'progress', score: 1 },
        who: { status: 'done', score: 2 },
        procedures: { status: 'new', score: null },
        summary: { status: 'new', score: null }
      },
      mentor: false,
      note: 'נועה עברה את המבוא ואת "מי זה מי" יפה. לחזור איתה על אזורי המשנה לפני הפגישה של יום שלישי.'
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.topics) return parsed;
      }
    } catch (e) {}
    return sample();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  var state = load();
  var current = null;   // topic object open in lesson view
  var picks = [];       // chosen option index per question
  var checked = false;

  // helpers
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(n) { while (n.firstChild) n.removeChild(n.firstChild); }
  function statusOf(t) { return (state.topics[t.id] || { status: 'new' }).status; }
  function statusLabel(s, score) {
    if (s === 'done') return 'הושלם' + (score != null ? ' (' + score + ' מתוך 3)' : '');
    if (s === 'progress') return 'בתהליך';
    return 'עוד לא התחיל';
  }
  function doneCount() { return TOPICS.filter(function (t) { return statusOf(t) === 'done'; }).length; }
  function nextTopic() {
    return TOPICS.filter(function (t) { return statusOf(t) !== 'done'; })[0] || null;
  }
  var toastTimer = null;
  function toast(msg) {
    $('toast').textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $('toast').textContent = ''; }, 2200);
  }

  // ---- home ----
  function renderHome() {
    var done = doneCount();
    $('progressText').textContent = done + ' מתוך ' + TOPICS.length + ' נושאים';
    $('progressBar').style.width = Math.round(done / TOPICS.length * 100) + '%';
    var nt = nextTopic();
    $('progressHint').textContent = nt ? 'הבא: ' + nt.title : 'כל הנושאים הושלמו';
    $('nextBtn').disabled = !nt;
    $('nextBtn').textContent = nt ? 'נושא הבא: ' + nt.title : 'סיימת את כל הנושאים';

    var list = $('topicList');
    clear(list);
    TOPICS.forEach(function (t, i) {
      var li = el('li');
      var b = el('button', 'topic');
      b.type = 'button';
      var s = statusOf(t);
      var dot = el('span', 'dot ' + (s === 'new' ? '' : s));
      dot.setAttribute('aria-hidden', 'true');
      var num = el('span', 'num', String(i + 1));
      var txt = el('span', 'txt');
      txt.appendChild(el('span', 'name', t.title));
      var sc = state.topics[t.id] ? state.topics[t.id].score : null;
      txt.appendChild(el('span', 'meta', statusLabel(s, sc) + ' · ' + t.sub));
      b.appendChild(num); b.appendChild(txt); b.appendChild(dot);
      b.setAttribute('aria-label', t.title + ', ' + statusLabel(s, sc));
      b.addEventListener('click', function () { openLesson(t); });
      li.appendChild(b);
      list.appendChild(li);
    });

    // mentor
    $('mentorToggle').setAttribute('aria-pressed', state.mentor ? 'true' : 'false');
    $('mentorPanel').hidden = !state.mentor;
    var ml = $('mentorList');
    clear(ml);
    TOPICS.forEach(function (t) {
      var li = el('li');
      var s = statusOf(t);
      var sc = state.topics[t.id] ? state.topics[t.id].score : null;
      li.appendChild(el('span', '', t.title));
      li.appendChild(el('span', 'state ' + (s === 'done' ? 'done' : ''), s === 'done' ? '✓ ' + statusLabel(s, sc) : statusLabel(s, sc)));
      ml.appendChild(li);
    });
    var ta = $('mentorNote');
    if (document.activeElement !== ta) ta.value = state.note || '';
  }

  // ---- lesson ----
  function openLesson(t) {
    current = t;
    picks = t.quiz.map(function () { return -1; });
    checked = false;
    if (statusOf(t) === 'new') {
      state.topics[t.id] = { status: 'progress', score: null };
      save();
    }
    renderLesson();
    $('home').hidden = true;
    $('lesson').hidden = false;
    window.scrollTo(0, 0);
    $('backBtn').focus();
  }
  function goHome() {
    current = null;
    renderHome();
    $('lesson').hidden = true;
    $('home').hidden = false;
    window.scrollTo(0, 0);
  }

  function renderLesson() {
    var t = current;
    var idx = TOPICS.indexOf(t);
    $('lessonEyebrow').textContent = 'נושא ' + (idx + 1) + ' מתוך ' + TOPICS.length + ' · רובע הגפן';
    $('lessonTitle').textContent = t.title;
    var body = $('lessonBody');
    clear(body);
    t.paras.forEach(function (p) { body.appendChild(el('p', '', p)); });

    var quiz = $('quiz');
    clear(quiz);
    t.quiz.forEach(function (q, qi) {
      var wrap = el('div', 'q');
      wrap.setAttribute('role', 'radiogroup');
      wrap.setAttribute('aria-labelledby', 'q' + qi);
      var qt = el('div', 'qt', (qi + 1) + '. ' + q.q);
      qt.id = 'q' + qi;
      wrap.appendChild(qt);
      q.opts.forEach(function (o, oi) {
        var b = el('button', 'opt');
        b.type = 'button';
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', picks[qi] === oi ? 'true' : 'false');
        b.appendChild(el('span', 'radio'));
        b.appendChild(el('span', '', o));
        if (checked) {
          b.disabled = true;
          if (oi === q.a) b.classList.add('correct');
          else if (picks[qi] === oi) b.classList.add('wrong');
        } else {
          b.addEventListener('click', function () {
            picks[qi] = oi;
            renderLesson();
          });
        }
        wrap.appendChild(b);
      });
      if (checked) {
        var right = picks[qi] === q.a;
        wrap.appendChild(el('div', 'why ' + (right ? 'ok' : 'bad'), (right ? 'נכון. ' : 'לא נכון. ') + q.why));
      }
      quiz.appendChild(wrap);
    });

    var allPicked = picks.every(function (p) { return p >= 0; });
    $('checkBtn').hidden = checked;
    $('checkBtn').disabled = !allPicked;
    $('checkBtn').textContent = allPicked ? 'בדיקת תשובות' : 'בחרו תשובה לכל שאלה';

    var rb = $('resultBox');
    clear(rb);
    var passed = false;
    if (checked) {
      var score = t.quiz.reduce(function (n, q, i) { return n + (picks[i] === q.a ? 1 : 0); }, 0);
      passed = score >= PASS;
      var box = el('div', 'result ' + (passed ? 'pass' : 'fail'));
      box.setAttribute('role', 'status');
      box.appendChild(el('div', 'score', score + ' מתוך 3 נכונות'));
      box.appendChild(el('div', '', passed
        ? 'עברת. הנושא "' + t.title + '" סומן כהושלם.'
        : 'צריך לפחות ' + PASS + ' מתוך 3. קראו שוב את הקטע ונסו עוד פעם.'));
      rb.appendChild(box);
    }
    $('retryBtn').hidden = !(checked && !passed);
    $('doneBtn').hidden = !(checked && passed);
    var nt = nextTopic();
    $('doneBtn').textContent = nt ? 'חזרה לרשימה · הבא: ' + nt.title : 'סיימת הכול, חזרה לרשימה';
  }

  function checkAnswers() {
    if (!current) return;
    checked = true;
    var score = current.quiz.reduce(function (n, q, i) { return n + (picks[i] === q.a ? 1 : 0); }, 0);
    var prev = state.topics[current.id] || {};
    if (score >= PASS) {
      state.topics[current.id] = { status: 'done', score: score };
    } else {
      state.topics[current.id] = { status: 'progress', score: prev.status === 'done' ? prev.score : score };
    }
    save();
    renderLesson();
    $('resultBox').scrollIntoView({ block: 'nearest' });
  }

  // ---- wiring ----
  $('nextBtn').addEventListener('click', function () {
    var nt = nextTopic();
    if (nt) openLesson(nt);
  });
  $('backBtn').addEventListener('click', goHome);
  $('doneBtn').addEventListener('click', goHome);
  $('checkBtn').addEventListener('click', checkAnswers);
  $('retryBtn').addEventListener('click', function () {
    picks = current.quiz.map(function () { return -1; });
    checked = false;
    renderLesson();
    $('quiz').scrollIntoView({ block: 'start' });
  });
  $('mentorToggle').addEventListener('click', function () {
    state.mentor = !state.mentor;
    save();
    renderHome();
    if (state.mentor) $('mentorPanel').scrollIntoView({ block: 'nearest' });
  });
  var noteTimer = null;
  $('mentorNote').addEventListener('input', function (e) {
    state.note = e.target.value;
    save();
    $('noteSaved').textContent = 'נשמר במכשיר הזה';
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { $('noteSaved').textContent = ''; }, 1800);
  });
  $('resetBtn').addEventListener('click', function () {
    state = sample();
    save();
    renderHome();
    toast('הוחזרו נתוני הדוגמה');
  });

  renderHome();
})();
</script>
</body>
</html>
