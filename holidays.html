<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>סוגיות אסלאמיות וחגים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* פריסה: מסגרת טלפון ממורכזת (430px), תוכן גולל בפנים, טאבים ופוטר קבועים בתחתית המסגרת */
:root {
  --bg: #F3F4F1; --surface: #FFFFFF; --sunk: #EEF0EC; --ink: #17212B; --muted: #55606B;
  --line: #DCE0DA; --line2: #9AA3AC; --accent: #1E4FA8; --on-accent: #FFFFFF;
  --warm: #A9480C; --warm-soft: #FBEBDD; --on-warm: #FFFFFF; --ok: #2F6B3F; --danger: #B42318;
  --font: Assistant, "Segoe UI", Arial, sans-serif;
  --display: Rubik, Assistant, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171D; --surface: #1B222A; --sunk: #151B21; --ink: #EEF1F4; --muted: #A7B0BA;
    --line: #2C3640; --line2: #56636F; --accent: #8EB0F2; --on-accent: #0E1620;
    --warm: #F0A464; --warm-soft: #3A2A1C; --on-warm: #1A1007; --ok: #86C79A; --danger: #FF9B8F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171D; --surface: #1B222A; --sunk: #151B21; --ink: #EEF1F4; --muted: #A7B0BA;
  --line: #2C3640; --line2: #56636F; --accent: #8EB0F2; --on-accent: #0E1620;
  --warm: #F0A464; --warm-soft: #3A2A1C; --on-warm: #1A1007; --ok: #86C79A; --danger: #FF9B8F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sunk);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
}
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.25; }
p { margin: 0; }
ul { margin: 0; padding-inline-start: 20px; }
li { margin-block: 4px; }
[lang="ar"] { font-family: var(--display); direction: rtl; }

.page {
  min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.above { text-align: center; color: var(--muted); font-size: 14px; }
.above .kicker {
  font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .06em;
  color: var(--ink);
}
.phone {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  height: 100dvh;
  max-height: 860px;
  min-height: 0;
  background: var(--bg);
  border: 2px solid var(--line2);
  border-radius: 32px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
@media (max-width: 480px) {
  body { background: var(--bg); }
  .page { padding: 0; gap: 0; min-height: 100%; }
  .above { display: none; }
  .phone { max-width: none; max-height: none; height: 100vh; height: 100dvh; border: 0; border-radius: 0; }
}

/* כותרת עליונה */
.top {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  min-height: 60px;
}
.top h1 { font-size: 21px; font-weight: 700; flex: 1; min-width: 0; }
.back {
  background: none; border: 1px solid var(--line); border-radius: 999px;
  min-height: 44px; min-width: 44px; padding: 0 12px;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px;
}
.back:hover { background: var(--sunk); }

/* תוכן גולל */
main {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  padding: 16px;
  display: flex; flex-direction: column; gap: 14px;
}
.note { color: var(--muted); font-size: 14px; }
.note strong { color: var(--ink); font-weight: 600; }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display: flex; flex-direction: column; gap: 10px;
}
.card h2 { font-size: 20px; }
.card h3 { font-size: 16px; font-weight: 500; color: var(--muted); }
.hero { border: 1.5px solid var(--accent); }
.eyebrow {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
}
.eyebrow .label {
  font-family: var(--display); font-size: 13px; font-weight: 500; letter-spacing: .06em; color: var(--accent);
}
.count {
  font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.names { display: flex; flex-direction: column; gap: 2px; }
.names .ar { font-size: 18px; color: var(--muted); }
.date { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.chip {
  display: inline-block; padding: 3px 10px; border-radius: 999px;
  background: var(--warm-soft); color: var(--warm); font-weight: 700; font-size: 14px; white-space: nowrap;
}
.chip.now { background: var(--accent); color: var(--on-accent); }
.tips { background: var(--sunk); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.tips h3 { color: var(--ink); font-weight: 700; font-size: 16px; }
.btn {
  min-height: 48px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--on-accent);
  font-weight: 700; padding: 0 20px; width: 100%;
}
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); color: var(--accent); border: 1.5px solid var(--accent); }

.section-title { font-size: 15px; font-weight: 500; color: var(--muted); font-family: var(--display); }
.list { display: flex; flex-direction: column; gap: 8px; }
.row {
  width: 100%; text-align: start;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; min-height: 64px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
}
.row:hover { border-color: var(--line2); }
.row .names { flex: 1; min-width: 0; }
.row .names .he { font-family: var(--display); font-weight: 500; font-size: 17px; }
.row .names .ar { font-size: 15px; }
.row .side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.check { color: var(--ok); font-weight: 700; font-size: 14px; white-space: nowrap; }

/* דף חג */
.greet { background: var(--warm-soft); border: 0; }
.greet .big { font-size: 28px; font-weight: 500; color: var(--ink); }
.greet .translit { font-weight: 700; }
.greet .meaning { color: var(--muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 15px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

/* חידון */
.q { display: flex; flex-direction: column; gap: 8px; }
.q .qt { font-weight: 700; }
.opt {
  width: 100%; text-align: start; min-height: 48px;
  padding: 10px 14px; border-radius: 12px;
  background: var(--surface); border: 1.5px solid var(--line);
}
.opt:hover:not(:disabled) { border-color: var(--line2); }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); color: var(--ok); font-weight: 700; }
.opt.wrong { border-color: var(--danger); color: var(--danger); }
.fb { font-size: 15px; padding: 8px 12px; border-radius: 10px; background: var(--sunk); }
.fb.good { color: var(--ok); font-weight: 600; }
.result { text-align: center; display: flex; flex-direction: column; gap: 10px; }
.result .score { font-family: var(--display); font-size: 26px; font-weight: 700; }
.result .pass { color: var(--ok); }
.result .fail { color: var(--warm); }

/* מושגים */
.term { gap: 4px; }
.term .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.term .head .he { font-family: var(--display); font-weight: 700; font-size: 18px; }
.term .head .ar { font-size: 17px; color: var(--muted); }
.term .head .tr { font-size: 14px; color: var(--muted); }
.term p { font-size: 15px; }

/* טאבים ופוטר */
.tabs {
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface); border-top: 1px solid var(--line);
}
.tabs button {
  min-height: 54px; background: none; border: 0; border-top: 3px solid transparent;
  font-weight: 600; color: var(--muted); font-size: 16px;
}
.tabs button[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); font-weight: 700; }
footer {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  padding: 6px 16px calc(6px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
  color: var(--muted); font-size: 12px; line-height: 1.35;
}
footer p { flex: 1; min-width: 180px; }
.reset {
  background: none; border: 1px solid var(--line); border-radius: 999px;
  min-height: 44px; padding: 0 12px; font-size: 13px; color: var(--muted); white-space: nowrap;
}
.reset:hover { color: var(--ink); border-color: var(--line2); }
.toast {
  position: absolute; inset-inline: 16px; bottom: 130px;
  background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px;
  font-size: 14px; text-align: center;
}
.phone { position: relative; }
@media (prefers-reduced-motion: no-preference) {
  .opt, .row, .btn { transition: border-color .15s, filter .15s; }
}
</style>
</head>
<body>
<div class="page">
  <div class="above">
    <p class="kicker">אב טיפוס להדגמה</p>
    <p>נתוני דוגמה בלבד. שום דבר לא נשלח לשרת.</p>
  </div>

  <div class="phone">
    <header class="top">
      <button class="back" id="back" type="button" hidden aria-label="חזרה למסך הקודם"><span aria-hidden="true">&#x2192;</span> חזרה</button>
      <h1 id="title">החגים הקרובים</h1>
    </header>
    <main id="view" aria-live="polite"></main>
    <nav class="tabs" aria-label="ניווט ראשי">
      <button type="button" id="tab-home" aria-current="page">החגים הקרובים</button>
      <button type="button" id="tab-terms">מושגים</button>
    </nav>
    <footer>
      <p>אב טיפוס להדגמה בסדנא. נתוני דוגמה בלבד. נבנה עם Claude, בלי לכתוב קוד.</p>
      <button type="button" class="reset" id="reset">איפוס לדוגמה</button>
    </footer>
    <div class="toast" id="toast" hidden role="status"></div>
  </div>
</div>

  function ulOf(items) {
    var u = el('ul');
    items.forEach(function (t) { u.appendChild(el('li', { text: t })); });
    return u;
  }

  var view = document.getElementById('view');
  var titleEl = document.getElementById('title');
  var backBtn = document.getElementById('back');
  var tabHome = document.getElementById('tab-home');
  var tabTerms = document.getElementById('tab-terms');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 2200);
  }

  function setChrome(title, showBack, tab) {
    titleEl.textContent = title;
    backBtn.hidden = !showBack;
    tabHome.setAttribute('aria-current', tab === 'home' ? 'page' : 'false');
    tabTerms.setAttribute('aria-current', tab === 'terms' ? 'page' : 'false');
    view.replaceChildren();
    view.scrollTop = 0;
  }

  /* ---------- מסך הבית ---------- */
  function renderHome() {
    setChrome('החגים הקרובים', false, 'home');
    var list = resolved();
    var first = list[0];
    var anyRolled = list.some(function (r) { return r.rolled; });

    view.appendChild(el('p', { class: 'note' },
      el('strong', { text: 'היום: ' + fmt.format(TODAY) + '. ' }),
      'תאריכים משוערים, נקבעים לפי ראיית הירח.' + (anyRolled ? ' חגים שעברו הוזזו לשנה ההיג\'רית הבאה.' : '')));

    var hero = el('div', { class: 'card hero' },
      el('div', { class: 'eyebrow' },
        el('span', { class: 'label', text: first.days < 0 ? 'עכשיו' : 'החג הבא' }),
        state.passed[first.h.id] ? el('span', { class: 'check', text: '✓ עברתם את החידון' }) : null),
      el('p', { class: 'count', text: heroLabel(first) }),
      el('div', { class: 'names' },
        el('h2', { text: first.h.he }),
        el('span', { class: 'ar', lang: 'ar', text: first.h.ar })),
      el('p', { class: 'date', text: fmt.format(first.start) + ' (משוער) · ' + first.h.durationLabel }),
      el('p', { text: first.h.about }),
      el('div', { class: 'tips' },
        el('h3', { text: 'מה כדאי לדעת בעבודה' }),
        ulOf(first.h.work.slice(0, 3))),
      el('button', { class: 'btn', type: 'button', onclick: function () { renderHoliday(first.h.id); } }, 'לדף החג ולחידון')
    );
    view.appendChild(hero);

    if (list.length > 1) {
      view.appendChild(el('p', { class: 'section-title', text: 'אחר כך' }));
      var ul = el('div', { class: 'list' });
      list.slice(1).forEach(function (r) {
        var side = el('div', { class: 'side' },
          el('span', { class: 'chip' + (r.days < 0 ? ' now' : ''), text: relLabel(r) }),
          el('span', { class: 'date', text: fmtShort.format(r.start) }));
        var names = el('div', { class: 'names' },
          el('span', { class: 'he', text: r.h.he }),
          el('span', { class: 'ar', lang: 'ar', text: r.h.ar }),
          state.passed[r.h.id] ? el('span', { class: 'check', text: '✓ החידון עבר' }) : null);
        ul.appendChild(el('button', { class: 'row', type: 'button', onclick: (function (id) { return function () { renderHoliday(id); }; })(r.h.id) }, names, side));
      });
      view.appendChild(ul);
    }
  }

  /* ---------- דף חג ---------- */
  function renderHoliday(id) {
    var r = resolved().filter(function (x) { return x.h.id === id; })[0];
    if (!r) { renderHome(); return; }
    var h = r.h;
    setChrome(h.he, true, 'home');

    view.appendChild(el('div', { class: 'card' },
      el('div', { class: 'eyebrow' },
        el('span', { class: 'ar', lang: 'ar', style: 'font-size:22px', text: h.ar }),
        el('span', { class: 'chip' + (r.days < 0 ? ' now' : ''), text: relLabel(r) })),
      el('p', { class: 'date', text: fmt.format(r.start) + ' (משוער) · ' + h.durationLabel }),
      state.passed[id] ? el('p', { class: 'check', text: '✓ עברתם את החידון של החג הזה' }) : null
    ));

    view.appendChild(el('div', { class: 'card' },
      el('h3', { text: 'מה זה' }),
      el('p', { text: h.about })));

    view.appendChild(el('div', { class: 'card' },
      el('h3', { text: 'מנהגים' }),
      ulOf(h.customs)));

    view.appendChild(el('div', { class: 'card' },
      el('h3', { text: 'מה כדאי לדעת בעבודה' }),
      ulOf(h.work)));

    view.appendChild(el('div', { class: 'card greet' },
      el('h3', { text: 'ברכה מקובלת' }),
      el('p', { class: 'big', lang: 'ar', text: h.greet.ar }),
      el('p', { class: 'translit', text: h.greet.tr }),
      el('p', { class: 'meaning', text: h.greet.meaning }),
      el('p', { class: 'meaning', text: h.greet.reply })));

    view.appendChild(renderQuiz(h));
  }

  function renderQuiz(h) {
    var card = el('div', { class: 'card' });
    var answers = [];
    function build() {
      card.replaceChildren();
      card.appendChild(el('h3', { text: 'חידון קצר: 3 שאלות' }));
      h.quiz.forEach(function (q, qi) {
        var block = el('div', { class: 'q' });
        block.appendChild(el('p', { class: 'qt', text: (qi + 1) + '. ' + q.q }));
        var fb = el('p', { class: 'fb', hidden: '' });
        var buttons = [];
        q.opts.forEach(function (o, oi) {
          var b = el('button', { class: 'opt', type: 'button', text: o });
          b.addEventListener('click', function () {
            if (answers[qi] !== undefined) return;
            answers[qi] = oi;
            var good = oi === q.a;
            buttons.forEach(function (bb, i) {
              bb.disabled = true;
              if (i === q.a) bb.classList.add('correct');
              else if (i === oi) bb.classList.add('wrong');
            });
            fb.textContent = q.fb[oi];
            fb.className = 'fb' + (good ? ' good' : '');
            fb.hidden = false;
            if (answers.filter(function (x) { return x !== undefined; }).length === h.quiz.length) finish();
          });
          buttons.push(b);
          block.appendChild(b);
        });
        block.appendChild(fb);
        card.appendChild(block);
      });
    }
    function finish() {
      var score = answers.reduce(function (s, a, i) { return s + (a === h.quiz[i].a ? 1 : 0); }, 0);
      var passed = score >= 2;
      var res = el('div', { class: 'result' });
      res.appendChild(el('p', { class: 'score ' + (passed ? 'pass' : 'fail'), text: score + ' מתוך 3' }));
      if (passed) {
        state.passed[h.id] = true; save();
        res.appendChild(el('p', { text: '✓ עברתם. החג סומן כנלמד ברשימת החגים.' }));
      } else {
        res.appendChild(el('p', { text: 'כמעט. צריך לפחות 2 תשובות נכונות. קראו שוב את הדף ונסו שנית.' }));
      }
      res.appendChild(el('button', { class: 'btn ghost', type: 'button', onclick: function () { answers = []; build(); card.scrollIntoView({ block: 'start' }); } }, 'לנסות שוב'));
      res.appendChild(el('button', { class: 'btn', type: 'button', onclick: renderHome }, 'חזרה לחגים הקרובים'));
      card.appendChild(res);
    }
    build();
    return card;
  }

  /* ---------- מושגים ---------- */
  function renderTerms() {
    setChrome('מושגים', false, 'terms');
    view.appendChild(el('p', { class: 'note', text: TERMS.length + ' מושגים שעובדים נתקלים בהם בעבודה היומיומית. בערבית, בתעתיק ובשתי שורות הסבר.' }));
    TERMS.forEach(function (t) {
      view.appendChild(el('div', { class: 'card term' },
        el('div', { class: 'head' },
          el('span', { class: 'he', text: t.he }),
          el('span', { class: 'ar', lang: 'ar', text: t.ar }),
          el('span', { class: 'tr', text: t.tr })),
        el('p', { text: t.text })));
    });
  }

  /* ---------- ניווט ---------- */
  function go(tab) { state.tab = tab; save(); if (tab === 'terms') renderTerms(); else renderHome(); }
  tabHome.addEventListener('click', function () { go('home'); });
  tabTerms.addEventListener('click', function () { go('terms'); });
  backBtn.addEventListener('click', function () { go('home'); });
  document.getElementById('reset').addEventListener('click', function () {
    state = { tab: 'home', passed: {} };
    try { localStorage.removeItem(KEY); } catch (e) { /* מתעלמים */ }
    renderHome();
    toast('אופס לנתוני הדוגמה');
  });

  load();
  go(state.tab);
})();
</script>
</body>
</html>
