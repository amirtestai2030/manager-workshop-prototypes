<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>פודקאסט ענפי שבועי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@500;700&display=swap">
<style>
/* פריסה: מסגרת טלפון ממורכזת (430px), בתוכה מסך בית גלילי וגיליון נגן שעולה מלמטה */
:root {
  --bg: #F3F4F1; --surface: #FFFFFF; --sunk: #EEF0EC; --ink: #17212B; --muted: #55606B;
  --line: #DCE0DA; --line2: #9AA3AC; --accent: #1E4FA8; --on-accent: #FFFFFF;
  --warm: #A9480C; --warm-soft: #FBEBDD; --on-warm: #FFFFFF; --ok: #2F6B3F; --danger: #B42318;
  --font: Assistant, "Segoe UI", Arial, sans-serif;
  --display: Rubik, Assistant, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171D; --surface: #1B222A; --sunk: #151B21; --ink: #EEF1F4; --muted: #A7B0BA;
    --line: #2C3640; --line2: #56636F; --accent: #8EB0F2; --on-accent: #0E1620;
    --warm: #F0A464; --warm-soft: #3A2A1C; --on-warm: #1A1007; --ok: #86C79A; --danger: #FF9B8F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171D; --surface: #1B222A; --sunk: #151B21; --ink: #EEF1F4; --muted: #A7B0BA;
  --line: #2C3640; --line2: #56636F; --accent: #8EB0F2; --on-accent: #0E1620;
  --warm: #F0A464; --warm-soft: #3A2A1C; --on-warm: #1A1007; --ok: #86C79A; --danger: #FF9B8F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
h1, h2, h3 { font-family: var(--display); font-weight: 700; margin: 0; text-wrap: balance; }

/* --- מעטפת הדף ומסגרת הטלפון --- */
.page {
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: center;
}
.demo-head { display: none; }
.phone {
  width: 100%;
  max-width: 430px;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
@media (min-width: 481px) {
  .page { padding-block: 28px 40px; }
  .demo-head {
    display: block;
    text-align: center;
    margin-bottom: 14px;
    color: var(--muted);
    font-size: 14px;
  }
  .demo-head strong { display: block; color: var(--ink); font-family: var(--display); font-weight: 500; font-size: 15px; }
  .phone {
    min-height: 0;
    height: 860px;
    max-height: calc(100vh - 110px);
    border: 1px solid var(--line2);
    border-radius: 36px;
    overflow: hidden;
    box-shadow: 0 1px 0 var(--line);
  }
}
.phone { position: relative; }

/* --- מסך הבית --- */
.screen {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.topbar {
  padding: 18px 16px 10px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
}
.topbar h1 { font-size: 24px; }
.topbar .sub { color: var(--muted); font-size: 14px; }
.content { padding: 0 16px 20px; display: flex; flex-direction: column; gap: 18px; }

/* כרטיס הפרק של השבוע */
.hero {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--warm);
  background: var(--warm-soft);
  border-radius: 999px;
  padding: 3px 10px;
  align-self: flex-start;
}
.hero h2 { font-size: 21px; line-height: 1.3; }
.meta { color: var(--muted); font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.meta .dot::before { content: "·"; margin-inline-end: 10px; }
.summary { margin: 0; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hero-row { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.btn-primary {
  height: 48px;
  border: 0;
  border-radius: 999px;
  background: var(--accent);
  color: var(--on-accent);
  font-weight: 700;
  font-size: 17px;
  padding: 0 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex: 1;
}
.btn-primary svg { width: 20px; height: 20px; fill: currentColor; }
.hero-progress { flex: 1; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); width: 0; border-radius: 999px; }

/* רשימת הפרקים */
.section-title { font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; }
.section-title small { font-family: var(--font); font-weight: 400; color: var(--muted); font-size: 14px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.ep {
  width: 100%;
  text-align: start;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  min-height: 64px;
}
.ep .wk {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: var(--sunk);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: var(--display);
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.ep .wk b { font-size: 16px; }
.ep .wk small { font-size: 10px; color: var(--muted); }
.ep .body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ep .title { font-weight: 600; line-height: 1.3; }
.ep .meta { font-size: 13px; }
.ep .meta .state { color: var(--accent); font-weight: 600; }
.ep.done .meta .state { color: var(--ok); }
.ep .minibar { height: 3px; margin-top: 4px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.ep .minibar span { display: block; height: 100%; background: var(--accent); }
.ep.done .minibar span { background: var(--ok); }
.check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--line2);
  display: flex; align-items: center; justify-content: center;
  color: var(--on-accent);
}
.check svg { width: 14px; height: 14px; display: none; }
.ep.done .check { background: var(--ok); border-color: var(--ok); }
.ep.done .check svg { display: block; }

.reset-row { display: flex; justify-content: center; padding-top: 6px; }
.btn-ghost {
  background: none;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 14px;
  min-height: 44px;
  padding: 0 16px;
}
.toast {
  position: absolute;
  inset-inline: 16px;
  bottom: 70px;
  background: var(--ink);
  color: var(--bg);
  border-radius: 12px;
  padding: 10px 14px;
  text-align: center;
  font-size: 15px;
  z-index: 30;
}
footer {
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg);
}

/* --- גיליון הנגן --- */
.sheet-wrap { position: absolute; inset: 0; z-index: 20; display: flex; align-items: flex-end; }
.backdrop { position: absolute; inset: 0; background: rgba(23, 33, 43, 0.45); border: 0; padding: 0; }
.sheet {
  position: relative;
  width: 100%;
  max-height: 94%;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 22px 22px 0 0;
  border-top: 1px solid var(--line);
  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.grab { width: 40px; height: 4px; background: var(--line2); border-radius: 999px; margin: 0 auto; }
.sheet-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.sheet-head h2 { font-size: 20px; line-height: 1.3; }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  border: 0; border-radius: 50%;
  background: var(--sunk);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.note {
  background: var(--warm-soft);
  color: var(--warm);
  font-size: 13px;
  font-weight: 600;
  border-radius: 10px;
  padding: 6px 10px;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  align-self: flex-start;
}
.scrub { display: flex; flex-direction: column; gap: 4px; }
.scrub input[type="range"] {
  width: 100%;
  margin: 0;
  accent-color: var(--accent);
  height: 32px;
  direction: ltr;
}
.times { display: flex; justify-content: space-between; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.controls { display: flex; align-items: center; justify-content: center; gap: 14px; }
.ctl {
  width: 56px; height: 56px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--sunk);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
  line-height: 1;
  gap: 2px;
}
.ctl svg { width: 18px; height: 18px; fill: currentColor; }
.ctl.play {
  width: 72px; height: 72px;
  background: var(--accent);
  color: var(--on-accent);
  border-color: var(--accent);
}
.ctl.play svg { width: 30px; height: 30px; }
.ctl.speed { width: 56px; font-size: 15px; font-family: var(--display); }
.ctl.speed.fast { background: var(--warm-soft); color: var(--warm); border-color: transparent; }
.sheet-actions { display: flex; gap: 10px; }
.btn-outline {
  flex: 1;
  height: 48px;
  border-radius: 999px;
  border: 1.5px solid var(--accent);
  background: none;
  color: var(--accent);
  font-weight: 700;
  font-size: 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-outline.is-done { background: var(--ok); border-color: var(--ok); color: var(--on-accent); }
.block { background: var(--sunk); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.block h3 { font-size: 15px; font-weight: 500; }
.points { margin: 0; padding-inline-start: 20px; display: flex; flex-direction: column; gap: 6px; }
.points li::marker { color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 15px; font-weight: 600; }
.field textarea {
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  min-height: 84px;
  resize: vertical;
  width: 100%;
}
.field .hint { color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.field .hint .saved { color: var(--ok); font-weight: 600; }

@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>
</head>
<body>
<div class="page">
  <div class="demo-head" aria-hidden="true">
    <strong>אב טיפוס להדגמה</strong>
    נתוני דוגמה בלבד. שום דבר לא נשלח לשרת.
  </div>

  <div class="phone" id="phone">
    <div class="screen" id="screen">
      <header class="topbar">
        <h1>הפודקאסט הענפי</h1>
        <span class="sub" id="weekLabel"></span>
      </header>
      <main class="content">
        <section class="hero" id="hero" aria-labelledby="heroTitle"></section>
        <section aria-labelledby="pastTitle">
          <h2 class="section-title" id="pastTitle">פרקים קודמים <small id="pastCount"></small></h2>
          <div class="list" id="list" style="margin-top:10px"></div>
        </section>
        <div class="reset-row">
          <button type="button" class="btn-ghost" id="resetBtn">איפוס לדוגמה</button>
        </div>
      </main>
      <footer>אב טיפוס להדגמה בסדנא. נתוני דוגמה בלבד. נבנה עם Claude, בלי לכתוב קוד.</footer>
    </div>
    <div id="sheetRoot" hidden></div>
    <div class="toast" id="toast" hidden role="status"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var STORE_KEY = 'podcast-anafi-v1';
  var CURRENT_WEEK = 43;

  var EPISODES = [
    { id: 'w43', week: 43, title: 'עדכון הענף: מה חדש השבוע', dur: 580,
      summary: 'שלושה עדכונים קצרים מהשבוע האחרון, שינוי קטן בלוח הזמנים של המשמרות, ותודה לצוות שסיים פרויקט לפני הזמן.',
      points: ['לוח המשמרות של החודש הבא יפורסם ביום רביעי, יום אחד מוקדם מהרגיל.', 'טופס הדיווח השבועי עבר לגרסה קצרה יותר: שלוש שאלות במקום שבע.', 'צוות התחזוקה סיים את עבודות הקיץ שבוע לפני הזמן. כל הכבוד.'] },
    { id: 'w42', week: 42, title: 'מה למדנו החודש', dur: 680,
      summary: 'סיכום חודשי: שלוש תקלות קטנות שחזרו על עצמן, מה גילינו עליהן, ואיזה הרגל אחד מונע את רובן.',
      points: ['רוב העיכובים בחודש נבעו מציוד שלא הוחזר למקומו בסוף משמרת.', 'הרגל אחד עוזר: סבב בדיקה של שתי דקות לפני הסיום.', 'צוות אחד ניסה את זה חודש שלם וירד לאפס עיכובים.'] },
    { id: 'w41', week: 41, title: 'ראיון עם עובד ותיק: יוסי', dur: 720,
      summary: 'יוסי, 23 שנים בענף, מספר איך נראה יום עבודה פעם, מה השתנה לטובה, ומה הוא היה אומר לעצמו ביום הראשון.',
      points: ['"ביום הראשון לא הבנתי כלום, ואף אחד לא ציפה שאבין."', 'השינוי הכי גדול לדעתו: היום שואלים שאלות בלי להתבייש.', 'עצה לחדשים: ללמוד מי יודע מה, ולא לנסות לדעת הכול לבד.'] },
    { id: 'w40', week: 40, title: 'טיפים לעבודה בקיץ', dur: 450,
      summary: 'חום, שתייה, הפסקות וביגוד: חמש עצות פשוטות מהצוות הרפואי לעבודה בטוחה בימים החמים.',
      points: ['לשתות לפני שמרגישים צמא: כוס מים כל חצי שעה.', 'הפסקה בצל כל שעה בימים של אזהרת חום.', 'אם מישהו ליד נראה מבולבל או חיוור, עוצרים ומדווחים מיד.'] },
    { id: 'w39', week: 39, title: 'שאלות מהשטח ותשובות', dur: 495,
      summary: 'עונים על שש שאלות שהגיעו דרך האפליקציה: החזר נסיעות, החלפת משמרת, ואיך מצטרפים לקורס הפנימי.',
      points: ['החזר נסיעות מגיש עד ה-5 בחודש, דרך הטופס בלבד.', 'החלפת משמרת: שני הצדדים מאשרים בהודעה לאחראי.', 'הקורס הפנימי נפתח פעמיים בשנה, ההרשמה פתוחה עכשיו.'] },
    { id: 'w38', week: 38, title: 'הכירו את צוות הלוגיסטיקה', dur: 605,
      summary: 'דנה וסאמר מצוות הלוגיסטיקה מסבירים מה קורה להזמנה מרגע שהיא יוצאת ועד שהיא מגיעה אליכם.',
      points: ['כל הזמנה עוברת שלוש תחנות, והארוכה שבהן היא הבדיקה.', 'הדרך המהירה לקבל ציוד: להזמין עד יום שני בצהריים.', 'הצוות מזמין את כולם לביקור קצר במחסן, פעם בחודש.'] },
    { id: 'w37', week: 37, title: 'בטיחות: שלוש תזכורות קצרות', dur: 430,
      summary: 'שלוש תזכורות שחוזרות בכל תדריך, ולמה הן עדיין חשובות גם למי שעובד פה שנים.',
      points: ['ציוד מגן לובשים לפני שנכנסים, לא אחרי.', 'מדווחים על כמעט-תאונה בדיוק כמו על תאונה.', 'אם משהו לא נראה בטוח, עוצרים. אף אחד לא ייפגע מזה.'] },
    { id: 'w36', week: 36, title: 'איך נראה שבוע עבודה של נועה', dur: 540,
      summary: 'נועה, ראש צוות חדשה, לוקחת אותנו דרך שבוע אחד: תכנון, הפתעות, ומה היא לומדת מהצוות שלה.',
      points: ['יום ראשון מוקדש לתכנון, ושאר השבוע לשינויים בתכנון.', 'הדבר שהכי עזר לה: שיחה של חמש דקות עם כל אחד פעם בשבוע.', 'הטעות הראשונה שלה כראש צוות, ואיך תיקנה אותה.'] },
    { id: 'w35', week: 35, title: 'סיכום הרבעון ומה הלאה', dur: 705,
      summary: 'מה עשינו ברבעון האחרון, שלושה מספרים ששווה לזכור, ומה מתוכנן לרבעון הבא.',
      points: ['שלושה יעדים הושגו, אחד נדחה לרבעון הבא.', 'מספר שכדאי לזכור: 92% מהמשימות נסגרו בזמן.', 'ברבעון הבא: יותר הכשרות קצרות, פחות ישיבות ארוכות.'] }
  ];

  // מצב דוגמה: כמה פרקים הואזנו, כמה באמצע, כמה עוד לא נפתחו
  function sampleState() {
    return {
      progress: {
        w43: { pos: 0, done: false },
        w42: { pos: 200, done: false },
        w41: { pos: 720, done: true },
        w40: { pos: 450, done: true },
        w39: { pos: 95, done: false },
        w38: { pos: 605, done: true },
        w37: { pos: 0, done: false },
        w36: { pos: 540, done: true },
        w35: { pos: 705, done: true }
      },
      questions: {
        w41: 'יוסי, איזה כלי אחד היית משאיר מהתקופה ההיא?'
      },
      speed: 1
    };
  }

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.progress) return parsed;
      }
    } catch (e) { /* אחסון חסום: עובדים בזיכרון בלבד */ }
    return sampleState();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* מתעלמים */ }
  }
  function prog(id) {
    if (!state.progress[id]) state.progress[id] = { pos: 0, done: false };
    return state.progress[id];
  }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function minutesLabel(sec) { return Math.round(sec / 60) + ' דק׳'; }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function svgIcon(kind) {
    var ns = 'http://www.w3.org/2000/svg';
    var s = document.createElementNS(ns, 'svg');
    s.setAttribute('viewBox', '0 0 24 24');
    s.setAttribute('aria-hidden', 'true');
    var p = document.createElementNS(ns, 'path');
    var d = {
      play: 'M8 5v14l11-7z',
      pause: 'M6 5h4v14H6zM14 5h4v14h-4z',
      check: 'M20 6L9 17l-5-5 1.5-1.5L9 14l9.5-9.5z'
    }[kind];
    p.setAttribute('d', d);
    s.appendChild(p);
    return s;
  }
  function stateText(ep) {
    var p = prog(ep.id);
    if (p.done) return 'הואזן';
    if (p.pos > 0) return 'נשמע עד ' + fmt(p.pos);
    return 'עוד לא נשמע';
  }

  // --- מסך הבית ---
  var heroEl = document.getElementById('hero');
  var listEl = document.getElementById('list');
  var weekLabel = document.getElementById('weekLabel');
  var pastCount = document.getElementById('pastCount');

  function renderHome() {
    var current = EPISODES[0];
    var past = EPISODES.slice(1);
    weekLabel.textContent = 'שבוע ' + CURRENT_WEEK;

    heroEl.textContent = '';
    var p = prog(current.id);
    var eyebrow = el('span', 'eyebrow', p.done ? 'הפרק של השבוע · הואזן' : 'הפרק של השבוע');
    var h2 = el('h2', null, current.title);
    h2.id = 'heroTitle';
    var meta = el('div', 'meta');
    meta.appendChild(el('span', null, 'שבוע ' + current.week));
    meta.appendChild(el('span', 'dot', minutesLabel(current.dur) + ' (' + fmt(current.dur) + ')'));
    var sum = el('p', 'summary', current.summary);
    var row = el('div', 'hero-row');
    var playBtn = el('button', 'btn-primary');
    playBtn.type = 'button';
    playBtn.appendChild(svgIcon('play'));
    playBtn.appendChild(document.createTextNode(p.done ? 'להאזין שוב' : (p.pos > 0 ? 'להמשיך מ-' + fmt(p.pos) : 'הפעלה')));
    playBtn.addEventListener('click', function () { openPlayer(current.id, true); });
    row.appendChild(playBtn);
    heroEl.appendChild(eyebrow);
    heroEl.appendChild(h2);
    heroEl.appendChild(meta);
    heroEl.appendChild(sum);
    if (p.pos > 0 && !p.done) {
      var bar = el('div', 'bar');
      var fill = el('span');
      fill.style.width = Math.round(p.pos / current.dur * 100) + '%';
      bar.appendChild(fill);
      heroEl.appendChild(bar);
    }
    heroEl.appendChild(row);

    listEl.textContent = '';
    var doneCount = past.filter(function (e) { return prog(e.id).done; }).length;
    pastCount.textContent = doneCount + ' מתוך ' + past.length + ' הואזנו';
    past.forEach(function (ep) {
      var pr = prog(ep.id);
      var b = el('button', 'ep' + (pr.done ? ' done' : ''));
      b.type = 'button';
      b.setAttribute('aria-label', ep.title + ', שבוע ' + ep.week + ', ' + minutesLabel(ep.dur) + ', ' + stateText(ep));
      var wk = el('div', 'wk');
      wk.appendChild(el('small', null, 'שבוע'));
      wk.appendChild(el('b', null, String(ep.week)));
      var body = el('div', 'body');
      body.appendChild(el('div', 'title', ep.title));
      var m = el('div', 'meta');
      m.appendChild(el('span', null, fmt(ep.dur)));
      m.appendChild(el('span', 'dot state', stateText(ep)));
      body.appendChild(m);
      if (pr.pos > 0 && !pr.done) {
        var mb = el('div', 'minibar');
        var mf = el('span');
        mf.style.width = Math.round(pr.pos / ep.dur * 100) + '%';
        mb.appendChild(mf);
        body.appendChild(mb);
      }
      var chk = el('div', 'check');
      chk.appendChild(svgIcon('check'));
      b.appendChild(wk);
      b.appendChild(body);
      b.appendChild(chk);
      b.addEventListener('click', function () { openPlayer(ep.id, false); });
      listEl.appendChild(b);
    });
  }

  // --- גיליון הנגן ---
  var sheetRoot = document.getElementById('sheetRoot');
  var player = { id: null, timer: null, playing: false, ui: null };

  function openPlayer(id, autoplay) {
    closePlayer();
    var ep = EPISODES.filter(function (e) { return e.id === id; })[0];
    var p = prog(id);
    if (p.done && p.pos >= ep.dur) p.pos = 0; // האזנה חוזרת מתחילה מההתחלה
    player.id = id;

    var wrap = el('div', 'sheet-wrap');
    var backdrop = el('button', 'backdrop');
    backdrop.type = 'button';
    backdrop.setAttribute('aria-label', 'סגירת הנגן');
    backdrop.addEventListener('click', closePlayer);

    var sheet = el('div', 'sheet');
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-labelledby', 'sheetTitle');
    sheet.appendChild(el('div', 'grab'));

    var head = el('div', 'sheet-head');
    var hBox = el('div');
    var h = el('h2', null, ep.title);
    h.id = 'sheetTitle';
    var hm = el('div', 'meta');
    hm.appendChild(el('span', null, 'שבוע ' + ep.week));
    hm.appendChild(el('span', 'dot', minutesLabel(ep.dur)));
    hBox.appendChild(h);
    hBox.appendChild(hm);
    var close = el('button', 'icon-btn', '✕');
    close.type = 'button';
    close.setAttribute('aria-label', 'סגירה');
    close.addEventListener('click', closePlayer);
    head.appendChild(hBox);
    head.appendChild(close);
    sheet.appendChild(head);

    sheet.appendChild(el('div', 'note', 'הדגמה: בלי קובץ שמע אמיתי'));

    // סרגל התקדמות
    var scrub = el('div', 'scrub');
    var range = document.createElement('input');
    range.type = 'range';
    range.id = 'scrub-' + id;
    range.min = '0';
    range.max = String(ep.dur);
    range.step = '1';
    range.value = String(p.pos);
    range.setAttribute('aria-label', 'מיקום בפרק');
    range.addEventListener('input', function () {
      p.pos = Number(range.value);
      if (p.pos < ep.dur && p.done) p.done = false;
      save();
      updateUI();
    });
    var times = el('div', 'times');
    var tCur = el('span', null, fmt(p.pos));
    var tLeft = el('span', null, '-' + fmt(ep.dur - p.pos));
    times.appendChild(tCur);
    times.appendChild(tLeft);
    scrub.appendChild(range);
    scrub.appendChild(times);
    sheet.appendChild(scrub);

    // כפתורי שליטה
    var controls = el('div', 'controls');
    var fwd = el('button', 'ctl');
    fwd.type = 'button';
    fwd.setAttribute('aria-label', 'קדימה 15 שניות');
    fwd.appendChild(el('span', null, '+15'));
    fwd.addEventListener('click', function () { seek(15); });

    var play = el('button', 'ctl play');
    play.type = 'button';
    play.appendChild(svgIcon('play'));
    play.addEventListener('click', togglePlay);

    var back = el('button', 'ctl');
    back.type = 'button';
    back.setAttribute('aria-label', 'אחורה 15 שניות');
    back.appendChild(el('span', null, '-15'));
    back.addEventListener('click', function () { seek(-15); });

    var speed = el('button', 'ctl speed', state.speed + 'x');
    speed.type = 'button';
    speed.setAttribute('aria-label', 'מהירות ניגון');
    speed.addEventListener('click', function () {
      state.speed = state.speed === 1 ? 1.5 : 1;
      save();
      updateUI();
    });

    // סדר ויזואלי ב-RTL: אחורה מימין, הפעלה באמצע, קדימה משמאל, מהירות בקצה
    controls.appendChild(back);
    controls.appendChild(play);
    controls.appendChild(fwd);
    controls.appendChild(speed);
    sheet.appendChild(controls);

    var actions = el('div', 'sheet-actions');
    var markBtn = el('button', 'btn-outline');
    markBtn.type = 'button';
    markBtn.addEventListener('click', function () {
      if (p.done) {
        p.done = false;
        showToast('הסימון הוסר');
      } else {
        p.done = true;
        p.pos = ep.dur;
        stopTimer();
        showToast('סומן כהואזן');
      }
      save();
      updateUI();
      renderHome();
    });
    actions.appendChild(markBtn);
    sheet.appendChild(actions);

    // נקודות עיקריות
    var pts = el('div', 'block');
    pts.appendChild(el('h3', null, 'נקודות עיקריות'));
    var ul = el('ul', 'points');
    ep.points.forEach(function (t) { ul.appendChild(el('li', null, t)); });
    pts.appendChild(ul);
    sheet.appendChild(pts);

    // שאלה לפרק
    var field = el('div', 'field');
    var label = el('label', null, 'שאלה לפרק');
    label.htmlFor = 'q-' + id;
    var ta = document.createElement('textarea');
    ta.id = 'q-' + id;
    ta.placeholder = 'מה הייתם רוצים לשאול את מי שהקליט את הפרק?';
    ta.value = state.questions[id] || '';
    var hint = el('div', 'hint');
    var hintText = el('span', null, 'נשמר אצלך בטלפון בלבד.');
    var savedMark = el('span', 'saved', ta.value ? 'נשמר' : '');
    hint.appendChild(hintText);
    hint.appendChild(savedMark);
    var saveTimer = null;
    ta.addEventListener('input', function () {
      state.questions[id] = ta.value;
      savedMark.textContent = 'שומר…';
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        if (!state.questions[id]) delete state.questions[id];
        save();
        savedMark.textContent = state.questions[id] ? 'נשמר' : '';
      }, 400);
    });
    field.appendChild(label);
    field.appendChild(ta);
    field.appendChild(hint);
    sheet.appendChild(field);

    wrap.appendChild(backdrop);
    wrap.appendChild(sheet);
    sheetRoot.textContent = '';
    sheetRoot.appendChild(wrap);
    sheetRoot.hidden = false;

    player.ui = { ep: ep, p: p, range: range, tCur: tCur, tLeft: tLeft, play: play, speed: speed, markBtn: markBtn };
    updateUI();
    close.focus();
    if (autoplay) startTimer();

    function seek(delta) {
      p.pos = Math.min(ep.dur, Math.max(0, p.pos + delta));
      if (p.pos < ep.dur && p.done) p.done = false;
      save();
      updateUI();
    }
    function togglePlay() {
      if (player.playing) stopTimer(); else {
        if (p.pos >= ep.dur) p.pos = 0;
        startTimer();
      }
    }
  }

  function startTimer() {
    var ui = player.ui;
    if (!ui) return;
    stopTimer();
    player.playing = true;
    var last = Date.now();
    player.timer = setInterval(function () {
      var now = Date.now();
      ui.p.pos += ((now - last) / 1000) * state.speed;
      last = now;
      if (ui.p.pos >= ui.ep.dur) {
        ui.p.pos = ui.ep.dur;
        ui.p.done = true;
        stopTimer();
        showToast('הפרק הסתיים וסומן כהואזן');
        renderHome();
      }
      save();
      updateUI();
    }, 250);
    updateUI();
  }
  function stopTimer() {
    if (player.timer) clearInterval(player.timer);
    player.timer = null;
    player.playing = false;
    save();
    if (player.ui) updateUI();
    renderHome();
  }
  function updateUI() {
    var ui = player.ui;
    if (!ui) return;
    ui.range.value = String(Math.floor(ui.p.pos));
    ui.tCur.textContent = fmt(ui.p.pos);
    ui.tLeft.textContent = '-' + fmt(ui.ep.dur - ui.p.pos);
    ui.play.textContent = '';
    ui.play.appendChild(svgIcon(player.playing ? 'pause' : 'play'));
    ui.play.setAttribute('aria-label', player.playing ? 'השהיה' : 'הפעלה');
    ui.speed.textContent = state.speed + 'x';
    ui.speed.classList.toggle('fast', state.speed !== 1);
    ui.markBtn.textContent = '';
    if (ui.p.done) {
      ui.markBtn.classList.add('is-done');
      ui.markBtn.appendChild(svgIcon('check'));
      ui.markBtn.appendChild(document.createTextNode('הואזן'));
    } else {
      ui.markBtn.classList.remove('is-done');
      ui.markBtn.appendChild(document.createTextNode('סימון כהואזן'));
    }
  }
  function closePlayer() {
    if (player.timer) clearInterval(player.timer);
    player.timer = null;
    player.playing = false;
    player.ui = null;
    player.id = null;
    sheetRoot.hidden = true;
    sheetRoot.textContent = '';
    save();
    renderHome();
  }
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !sheetRoot.hidden) closePlayer();
  });

  // --- הודעה קצרה ---
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, 1800);
  }

  // --- איפוס ---
  document.getElementById('resetBtn').addEventListener('click', function () {
    closePlayer();
    state = sampleState();
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* מתעלמים */ }
    renderHome();
    showToast('נתוני הדוגמה שוחזרו');
  });

  renderHome();
})();
</script>
</body>
</html>
